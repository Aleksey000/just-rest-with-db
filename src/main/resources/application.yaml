spring:
  liquibase:
    enabled: true
    change-log: classpath:liquibase/master.xml
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    hikari:
      username: admin
      password: admin
      driver-class-name: org.postgresql.Driver
      schema: public